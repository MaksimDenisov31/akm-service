name: Deploy AKM to HostiMan
on:
  push:
    branches: [main]
    paths:
      - 'akm-service/dist/**'
      - 'akm-service/scripts/**'
      - '.github/workflows/deploy-hostiman.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akm-hostiman-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify deployment files
        run: |
          python3 -B -m unittest discover -s akm-service/scripts -p 'test_*.py'
          python3 -B akm-service/scripts/deploy_hostiman.py --check
      - name: Publish over FTPS
        env:
          HOSTIMAN_FTP_PASSWORD: ${{ secrets.HOSTIMAN_FTP_PASSWORD }}
        run: python3 -B akm-service/scripts/deploy_hostiman.py
